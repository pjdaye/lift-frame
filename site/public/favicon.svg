<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LIFT + FRAME favicon">
  <!-- FRAME: rounded boundary -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#22D3EE" stroke-width="4"/>

  <!-- LIFT: lifecycle spine -->
  <line x1="20" y1="18" x2="20" y2="46" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>

  <!-- Layer markers -->
  <circle cx="20" cy="20" r="3.4" fill="#22D3EE"/>
  <circle cx="20" cy="28" r="3.4" fill="#22D3EE"/>
  <circle cx="20" cy="36" r="3.4" fill="#22D3EE"/>
  <circle cx="20" cy="44" r="3.4" fill="#22D3EE"/>

  <!-- Fault/Threat "signals" -->
  <line x1="26" y1="20" x2="46" y2="20" stroke="#C47C3C" stroke-width="4" stroke-linecap="round"/>
  <line x1="26" y1="28" x2="42" y2="28" stroke="#C47C3C" stroke-width="4" stroke-linecap="round"/>
  <line x1="26" y1="36" x2="46" y2="36" stroke="#C47C3C" stroke-width="4" stroke-linecap="round"/>
  <line x1="26" y1="44" x2="38" y2="44" stroke="#C47C3C" stroke-width="4" stroke-linecap="round"/>
</svg>
