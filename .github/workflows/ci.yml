name: Validate taxonomy

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install validation deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Validate LIFT taxonomy
        run: python tools/validate_taxonomy.py